<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Seamless Cosmic Gradient -->
    <linearGradient id="galaxyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="75%" stop-color="#7f00ff" />
      <stop offset="100%" stop-color="#ff0844" />
    </linearGradient>

    <!-- Reverse Gradient for contrast -->
    <linearGradient id="orbitGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#7f00ff" />
      <stop offset="100%" stop-color="#ff0844" />
    </linearGradient>
  </defs>

  <!-- Thick Orbital Ring -->
  <ellipse cx="300" cy="300" rx="270" ry="130" transform="rotate(-30 300 300)" fill="none" stroke="url(#orbitGrad)" stroke-width="48" opacity="0.9" />

  <!-- Orbiting Planets -->
  <!-- Top Right Planet -->
  <circle cx="490" cy="190" r="50" fill="#ff0844" />
  <!-- Bottom Left Planet -->
  <circle cx="110" cy="410" r="40" fill="#00f2fe" />

  <!-- Central Star Outer -->
  <path d="M 300 40 Q 300 300 560 300 Q 300 300 300 560 Q 300 300 40 300 Q 300 300 300 40 Z" fill="url(#galaxyGrad)" />
  
  <!-- Central Star Inner -->
  <path d="M 300 140 Q 300 300 460 300 Q 300 300 300 460 Q 300 300 140 300 Q 300 300 300 140 Z" fill="#ffffff" />
  
  <!-- Core -->
  <circle cx="300" cy="300" r="48" fill="#00f2fe" />
</svg>
