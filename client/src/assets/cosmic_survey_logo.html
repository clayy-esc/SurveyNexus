<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cosmic Survey Logo</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      /* Absolutely transparent background, no checkerboard or dark colors */
      background: transparent;
      overflow: hidden;
    }

    .logo-container {
      width: 100%;
      max-width: 600px;
      aspect-ratio: 1 / 1;
      position: relative;
    }

    .pulse {
      transform-origin: 300px 300px;
      animation: pulse 2.5s ease-in-out infinite alternate;
    }

    .track {
      fill: none;
      stroke: url(#galaxyGrad);
      stroke-width: 1.5;
      opacity: 0.2;
    }
    
    .data-flow {
      fill: none;
      stroke: url(#galaxyGrad);
      filter: url(#soft-glow);
    }

    /* pathLength is 100. Sum of stroke-dasharray values must divide into 100 perfectly */
    .flow-data-1 {
      stroke-dasharray: 10 15; /* 25 * 4 = 100 */
      animation: flow-forward 5s linear infinite;
    }
    
    .flow-data-2 {
      stroke-dasharray: 20 30; /* 50 * 2 = 100 */
      animation: flow-reverse 7s linear infinite;
    }
    
    .flow-data-3 {
      stroke-dasharray: 8 12; /* 20 * 5 = 100 */
      animation: flow-forward 4s linear infinite;
    }

    @keyframes flow-forward {
      from { stroke-dashoffset: 100; }
      to { stroke-dashoffset: 0; }
    }
    
    @keyframes flow-reverse {
      from { stroke-dashoffset: -100; }
      to { stroke-dashoffset: 0; }
    }
    
    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      100% { transform: scale(1.1); opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="logo-container">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
      <defs>
        <!-- Seamless Cosmic Gradient -->
        <linearGradient id="galaxyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#00f2fe" />
          <stop offset="50%" stop-color="#4facfe" />
          <stop offset="75%" stop-color="#7f00ff" />
          <stop offset="100%" stop-color="#ff0844" />
        </linearGradient>

        <!-- Dynamic Glow Effects -->
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="8" result="blur" />
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
        
        <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="3" result="blur" />
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>

        <!-- 3D Depth Clipping Masks: Splits the visual field in half -->
        <clipPath id="back-half">
          <rect x="0" y="0" width="600" height="300" />
        </clipPath>
        <clipPath id="front-half">
          <rect x="0" y="300" width="600" height="300" />
        </clipPath>

        <!-- Normalized pathLength="100" enables the perfect CSS loop -->
        <path id="path-orbit-1" d="M 60 300 A 240 120 0 1 1 540 300 A 240 120 0 1 1 60 300" pathLength="100" />
        <path id="path-orbit-2" d="M 100 300 A 200 80 0 1 1 500 300 A 200 80 0 1 1 100 300" pathLength="100" />
        <path id="path-orbit-3" d="M 160 300 A 140 50 0 1 1 440 300 A 140 50 0 1 1 160 300" pathLength="100" />

        <!-- Minimalist Icons -->
        <g id="docIcon" stroke="#fff" stroke-width="1.5" fill="none">
          <path d="M -6 -8 L 2 -8 L 6 -4 L 6 8 L -6 8 Z" />
          <path d="M 2 -8 L 2 -4 L 6 -4" />
          <line x1="-3" y1="0" x2="3" y2="0" />
          <line x1="-3" y1="3" x2="3" y2="3" />
        </g>
        
        <g id="checkIcon" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M -5 0 L -1 4 L 6 -4" />
        </g>

        <g id="orbit-system">
          
          <!-- Outer Orbit Array -->
          <g transform="rotate(-30 300 300)">
            <use href="#path-orbit-1" class="track" />
            <use href="#path-orbit-1" class="data-flow flow-data-1" stroke-width="4"/>
            <!-- Active Orbiting Survey Planet (Document) -->
            <g>
              <g transform="rotate(30)"><circle r="18" fill="#ff0844" filter="url(#glow)"/><use href="#docIcon"/></g>
              <animateMotion dur="16s" repeatCount="indefinite" begin="0s"><mpath href="#path-orbit-1"/></animateMotion>
            </g>
            <!-- Active Orbiting Survey Planet (Checkmark) -->
            <g>
              <g transform="rotate(30)"><circle r="18" fill="#00f2fe" filter="url(#glow)"/><use href="#checkIcon"/></g>
              <animateMotion dur="16s" repeatCount="indefinite" begin="-8s"><mpath href="#path-orbit-1"/></animateMotion>
            </g>
          </g>

          <!-- Middle Orbit Array -->
          <g transform="rotate(45 300 300)">
            <use href="#path-orbit-2" class="track" />
            <use href="#path-orbit-2" class="data-flow flow-data-2" stroke-width="3"/>
            <!-- Active Orbiting Survey Planet (Checkmark) -->
            <g>
              <g transform="rotate(-45)"><circle r="15" fill="#4facfe" filter="url(#glow)"/><use href="#checkIcon"/></g>
              <animateMotion dur="12s" repeatCount="indefinite" begin="0s" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#path-orbit-2"/></animateMotion>
            </g>
            <!-- Active Orbiting Survey Planet (Document) -->
            <g>
              <g transform="rotate(-45)"><circle r="15" fill="#7f00ff" filter="url(#glow)"/><use href="#docIcon"/></g>
              <animateMotion dur="12s" repeatCount="indefinite" begin="-6s" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#path-orbit-2"/></animateMotion>
            </g>
          </g>

          <!-- Inner Orbit Array -->
          <g transform="rotate(-15 300 300)">
            <use href="#path-orbit-3" class="track" />
            <use href="#path-orbit-3" class="data-flow flow-data-3" stroke-width="2.5"/>
            <!-- Fast Moving Data Core Node -->
            <g>
              <circle r="10" fill="#fff" opacity="0.9" filter="url(#glow)"/>
              <animateMotion dur="8s" repeatCount="indefinite" begin="0s"><mpath href="#path-orbit-3"/></animateMotion>
            </g>
          </g>

        </g>
      </defs>

      <!-- Faint background nebula glow (Only atmospheric lighting, no solid backgrounds) -->
      <circle cx="300" cy="300" r="220" fill="url(#galaxyGrad)" opacity="0.07" filter="url(#glow)"/>

      <!-- LAYER 1: The Back Half of the Orbits (Rendered behind the central star) -->
      <g clip-path="url(#back-half)">
        <use href="#orbit-system" />
      </g>

      <!-- LAYER 2: The Central Data Star -->
      <g class="pulse">
        <!-- Outer Star Glow -->
        <path d="M 300 180 Q 300 300 420 300 Q 300 300 300 420 Q 300 300 180 300 Q 300 300 300 180 Z" fill="url(#galaxyGrad)" opacity="0.5" filter="url(#glow)"/>
        <!-- Inner Star Core -->
        <path d="M 300 220 Q 300 300 380 300 Q 300 300 300 380 Q 300 300 220 300 Q 300 300 300 220 Z" fill="#ffffff" filter="url(#glow)"/>
        <circle cx="300" cy="300" r="10" fill="#00f2fe" />
      </g>

      <!-- LAYER 3: The Front Half of the Orbits (Rendered on top of the central star) -->
      <g clip-path="url(#front-half)">
        <use href="#orbit-system" />
      </g>

    </svg>
  </div>

</body>
</html>
