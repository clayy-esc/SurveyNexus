<svg viewBox="0 0 200 200" width="100%" height="100%" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Galactic Arm 1 Gradient: Cosmic Cyan to Electric Indigo to Nebula Magenta -->
    <linearGradient id="galaxyArmAlpha" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="30%" stop-color="#6366f1" />
      <stop offset="65%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Galactic Arm 2 Gradient: Starburst Rose to Cosmic Purple to Azure Core -->
    <linearGradient id="galaxyArmBeta" x1="85%" y1="85%" x2="15%" y2="15%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="35%" stop-color="#a855f7" />
      <stop offset="70%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Orbital Trajectory Gradient -->
    <linearGradient id="orbitalTrajectory" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.8" />
    </linearGradient>

    <!-- Galactic Core Singularity Radiant Gradient -->
    <radialGradient id="galacticSingularity" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#cffafe" stop-opacity="0.95" />
      <stop offset="55%" stop-color="#818cf8" stop-opacity="0.5" />
      <stop offset="85%" stop-color="#6366f1" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <!-- Ambient Cosmic Nebula Glow -->
    <radialGradient id="ambientNebula" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.32" />
      <stop offset="40%" stop-color="#3b82f6" stop-opacity="0.18" />
      <stop offset="70%" stop-color="#ec4899" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <!-- High-Fidelity Glow Filters -->
    <filter id="softCelestialGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="intenseStarGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="glow1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="glow2" />
      <feMerge>
        <feMergeNode in="glow1" />
        <feMergeNode in="glow2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes celestialDrift {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulsarPulse {
      0%, 100% { transform: scale(1); opacity: 0.95; }
      50% { transform: scale(1.12); opacity: 1; }
    }
    .galaxy-dynamic-spin {
      transform-origin: 100px 100px;
      animation: celestialDrift 45s linear infinite;
    }
    .galaxy-pulsar {
      transform-origin: 100px 100px;
      animation: pulsarPulse 3.5s ease-in-out infinite;
    }
  </style>

  <!-- Ambient Ethereal Nebula Cloud (Transparent Atmosphere) -->
  <circle cx="100" cy="100" r="82" fill="url(#ambientNebula)" />

  <!-- Rotating Galaxy Disc Group -->
  <g class="galaxy-dynamic-spin">
    <!-- Orbital Data Trajectory (Survey Ellipse tilted at -30 deg) -->
    <ellipse cx="100" cy="100" rx="68" ry="28" transform="rotate(-30 100 100)" 
             stroke="url(#orbitalTrajectory)" 
             stroke-width="2" 
             stroke-dasharray="3 6 12 6" 
             fill="none" 
             opacity="0.8" />

    <!-- Milky Way Barred Spiral Arm Alpha (North-West to Core Convergence) -->
    <path d="M 32 64 C 42 34, 76 18, 114 22 C 150 26, 178 54, 180 92 C 182 124, 160 156, 130 166 C 104 174, 76 164, 62 144 C 52 130, 52 110, 64 96 C 76 82, 94 80, 108 88 C 118 94, 122 106, 118 116 C 114 122, 106 124, 100 122 C 94 120, 92 114, 94 108 C 96 102, 104 100, 108 102 C 102 98, 88 104, 86 114 C 84 128, 100 138, 116 134 C 136 128, 148 108, 144 88 C 140 64, 118 46, 92 46 C 62 46, 40 68, 38 98 C 36 120, 48 142, 66 156" 
          stroke="url(#galaxyArmAlpha)" 
          stroke-width="7.5" 
          stroke-linecap="round" 
          fill="none" 
          filter="url(#softCelestialGlow)" />

    <!-- Milky Way Barred Spiral Arm Beta (South-East to Core Convergence, S-N Nexus Flow) -->
    <path d="M 168 136 C 158 166, 124 182, 86 178 C 50 174, 22 146, 20 108 C 18 76, 40 44, 70 34 C 96 26, 124 36, 138 56 C 148 70, 148 90, 136 104 C 124 118, 106 120, 92 112 C 82 106, 78 94, 82 84 C 86 78, 94 76, 100 78 C 106 80, 108 86, 106 92 C 104 98, 96 100, 92 98 C 98 102, 112 96, 114 86 C 116 72, 100 62, 84 66 C 64 72, 52 92, 56 112 C 60 136, 82 154, 108 154 C 138 154, 160 132, 162 102 C 164 80, 152 58, 134 44" 
          stroke="url(#galaxyArmBeta)" 
          stroke-width="7.5" 
          stroke-linecap="round" 
          fill="none" 
          filter="url(#softCelestialGlow)" />

    <!-- Survey Nexus Constellation Nodes (Interactive Feedback Points) -->
    <!-- Input Apex Node (North) -->
    <circle cx="32" cy="64" r="5.5" fill="#38bdf8" filter="url(#intenseStarGlow)" />
    <circle cx="32" cy="64" r="2.8" fill="#ffffff" />

    <!-- Insight Apex Node (South) -->
    <circle cx="168" cy="136" r="5.5" fill="#f43f5e" filter="url(#intenseStarGlow)" />
    <circle cx="168" cy="136" r="2.8" fill="#ffffff" />

    <!-- Orbit Node: Question/Enquiry (East) -->
    <circle cx="148" cy="62" r="4.2" fill="#a855f7" filter="url(#intenseStarGlow)" />
    <circle cx="148" cy="62" r="2" fill="#ffffff" />

    <!-- Orbit Node: Response/Metric (West) -->
    <circle cx="52" cy="138" r="4.2" fill="#38bdf8" filter="url(#intenseStarGlow)" />
    <circle cx="52" cy="138" r="2" fill="#ffffff" />

    <!-- Celestial Stardust Micro-Nodes along Spiral Currents -->
    <circle cx="86" cy="38" r="1.6" fill="#e0e7ff" opacity="0.9" />
    <circle cx="164" cy="92" r="1.6" fill="#fbcfe8" opacity="0.85" />
    <circle cx="114" cy="162" r="1.6" fill="#cffafe" opacity="0.9" />
    <circle cx="36" cy="108" r="1.6" fill="#fed7aa" opacity="0.85" />
  </g>

  <!-- Central Supermassive Singularity / Nexus Core (Non-rotating Focal Anchor) -->
  <g class="galaxy-pulsar">
    <!-- Radiant Corona -->
    <circle cx="100" cy="100" r="24" fill="url(#galacticSingularity)" />
    <circle cx="100" cy="100" r="9" fill="#ffffff" filter="url(#intenseStarGlow)" />

    <!-- 4-Point Celestial Compass / Pulsar Star (Clarity & Direction) -->
    <path d="M 100 80 Q 100 100 80 100 Q 100 100 100 120 Q 100 100 120 100 Q 100 100 100 80 Z" 
          fill="#ffffff" />
    <path d="M 100 87 Q 100 100 87 100 Q 100 100 100 113 Q 100 100 113 100 Q 100 100 100 87 Z" 
          fill="#cffafe" />
    <circle cx="100" cy="100" r="3.2" fill="#ffffff" />
  </g>
</svg>
